<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Tafasir API</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#111; color:#eee; }
    input, button { padding:10px; margin:6px 0; width:100%; box-sizing:border-box; }
    button { cursor:pointer; }
    pre { background:#000; color:#0f0; padding:15px; white-space:pre-wrap; word-break:break-word; }
  </style>
</head>
<body>

  <h2>Test direct tafasir.online</h2>

  <label>API Key</label>
  <input id="apiKey" placeholder="colle ici ta clé API tafasir.online" />

  <label>Sourate</label>
  <input id="sura" type="number" value="1" />

  <label>Ayah</label>
  <input id="aya" type="number" value="1" />

  <label>Book ID</label>
  <input id="bookId" type="number" value="50" />

  <button onclick="testApi()">Tester</button>

  <pre id="out">En attente...</pre>

<script>
async function testApi() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const sura = document.getElementById("sura").value.trim();
  const aya = document.getElementById("aya").value.trim();
  const bookId = document.getElementById("bookId").value.trim();
  const out = document.getElementById("out");

  const url = `https://backend.tafasir.online/api/v2/books-content?sura=${sura}&aya=${aya}&book_ids[]=${bookId}`;

  out.textContent = "Chargement...";

  try {
    const res = await fetch(url, {
      method: "GET",
      headers: {
        "Accept": "application/json",
        "Authorization": `bearer ${apiKey}`
      }
    });

    const text = await res.text();

    out.textContent =
      "STATUS: " + res.status + "\n\n" +
      "URL: " + url + "\n\n" +
      text;
  } catch (err) {
    out.textContent = "Erreur fetch: " + err.message;
  }
}
</script>

</body>
</html>
