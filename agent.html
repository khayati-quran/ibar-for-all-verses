<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عامل نور القرآن — لوحة التشغيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --em:#0a3d2e; --em2:#1a6b4a; --gold:#b8860b; --gold2:#daa520; --gold3:#fff8dc;
  --bg:#0d1f18; --bg2:#112b1e; --bg3:#1a3d2b; --surface:#0f2419;
  --txt:#e8dcc8; --txt2:#c4b896; --red:#c0392b; --grn:#27ae60; --warn:#e67e22;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;min-height:100vh}

/* ── LOGIN ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:999;
}
.login-box{
  background:var(--bg2);border:2px solid var(--gold);border-radius:16px;
  padding:40px;width:min(360px,90vw);text-align:center;
}
.login-box h1{font-family:'Amiri',serif;color:var(--gold2);font-size:1.8em;margin-bottom:8px}
.login-box p{color:var(--txt2);font-size:.85em;margin-bottom:24px}
.pin-input{
  display:flex;gap:10px;justify-content:center;margin-bottom:20px;
}
.pin-input input{
  width:52px;height:60px;text-align:center;font-size:1.6em;font-weight:700;
  background:var(--bg3);border:2px solid rgba(184,134,11,.3);border-radius:8px;
  color:var(--gold2);outline:none;
}
.pin-input input:focus{border-color:var(--gold)}
.btn-login{
  width:100%;padding:12px;background:var(--gold);color:var(--bg);
  border:none;border-radius:8px;font-family:'Cairo',sans-serif;
  font-size:1em;font-weight:700;cursor:pointer;
}
.btn-login:hover{background:var(--gold2)}
.login-err{color:#e74c3c;font-size:.85em;margin-top:10px;min-height:20px}

/* ── MAIN LAYOUT ── */
#app{display:none}
.header{
  background:var(--bg2);border-bottom:2px solid rgba(184,134,11,.3);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
}
.header-title{font-family:'Amiri',serif;color:var(--gold2);font-size:1.3em}
.header-sub{font-size:.75em;color:var(--txt2)}
.header-status{display:flex;gap:8px;align-items:center}
.status-dot{width:10px;height:10px;border-radius:50%;background:#666}
.status-dot.ok{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.status-dot.err{background:var(--red)}

.main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 60px)}

/* ── SIDEBAR ── */
.sidebar{background:var(--surface);border-left:1px solid rgba(184,134,11,.2);padding:20px;overflow-y:auto;max-height:calc(100vh - 60px)}
.sidebar h2{font-size:.8em;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(184,134,11,.2)}

.config-group{margin-bottom:18px}
.config-label{font-size:.75em;color:var(--txt2);margin-bottom:5px;display:block}
.config-input{
  width:100%;padding:8px 10px;background:var(--bg3);border:1px solid rgba(184,134,11,.25);
  border-radius:6px;color:var(--txt);font-family:'Cairo',sans-serif;font-size:.85em;outline:none;
}
.config-input:focus{border-color:var(--gold)}
.config-input[type=password]{letter-spacing:.15em}

.btn{
  display:block;width:100%;padding:9px;border:none;border-radius:6px;
  font-family:'Cairo',sans-serif;font-size:.85em;font-weight:700;cursor:pointer;margin-bottom:8px;
}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:hover{background:var(--gold2)}
.btn-secondary{background:var(--bg3);color:var(--txt);border:1px solid rgba(184,134,11,.3)}
.btn-secondary:hover{background:var(--bg2)}
.btn-danger{background:rgba(192,57,43,.2);color:#e74c3c;border:1px solid rgba(192,57,43,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.82em}
.stat-val{color:var(--gold2);font-weight:700}

/* ── QUEUE ── */
.content{padding:20px;overflow-y:auto;max-height:calc(100vh - 60px)}
.content h2{font-family:'Amiri',serif;color:var(--gold2);font-size:1.3em;margin-bottom:16px}

.progress-bar{background:var(--bg3);border-radius:4px;height:8px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--em2),var(--gold));border-radius:4px;transition:width .4s}

.queue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.q-card{
  background:var(--bg2);border:1px solid rgba(184,134,11,.2);border-radius:8px;
  padding:12px 14px;position:relative;transition:border-color .2s;
}
.q-card.selected{border-color:var(--gold);background:var(--bg3)}
.q-card.done{border-color:var(--grn);opacity:.7}
.q-card.running{border-color:var(--gold2);animation:pulse 1s infinite}
.q-card.error{border-color:var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(218,165,32,.4)}50%{box-shadow:0 0 0 6px rgba(218,165,32,0)}}

.q-key{font-size:.72em;color:var(--gold);font-weight:700;margin-bottom:3px}
.q-type{
  display:inline-block;padding:2px 7px;border-radius:999px;font-size:.68em;font-weight:700;
  margin-bottom:5px;
}
.q-type.tawhid{background:rgba(184,134,11,.2);color:var(--gold2)}
.q-type.hidaya{background:rgba(26,107,74,.3);color:#5dff9f}
.q-type.ibada{background:rgba(52,152,219,.2);color:#7ec8e3}
.q-type.waeid{background:rgba(192,57,43,.2);color:#ff8080}
.q-type.akhlaqi{background:rgba(155,89,182,.2);color:#c39bd3}
.q-type.qissa{background:rgba(230,126,34,.2);color:#f0a500}
.q-type.waad{background:rgba(39,174,96,.2);color:#82e0aa}
.q-type.kawni{background:rgba(41,128,185,.2);color:#85c1e9}
.q-type.duaa{background:rgba(243,156,18,.2);color:#f9ca74}
.q-type.tashri3{background:rgba(127,140,141,.2);color:#aab7b8}
.q-status{font-size:.7em;color:var(--txt2)}
.q-status.done{color:var(--grn)}
.q-status.error{color:var(--red)}
.q-status.running{color:var(--gold2)}
.q-check{position:absolute;top:10px;left:10px}
.q-check input{accent-color:var(--gold)}

/* ── LOG ── */
.log-box{
  background:var(--bg3);border:1px solid rgba(184,134,11,.2);border-radius:8px;
  padding:14px;font-size:.78em;font-family:monospace;color:var(--txt2);
  max-height:200px;overflow-y:auto;direction:ltr;text-align:left;
}
.log-line{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-line.ok{color:var(--grn)}
.log-line.err{color:var(--red)}
.log-line.warn{color:var(--warn)}
.log-line.info{color:#5dade2}

/* ── BATCH CONTROLS ── */
.batch-bar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--bg2);border:1px solid rgba(184,134,11,.2);
  border-radius:8px;padding:12px 16px;margin-bottom:16px;
}
.batch-bar label{font-size:.8em;color:var(--txt2)}
.batch-bar select,.batch-bar input[type=number]{
  background:var(--bg3);border:1px solid rgba(184,134,11,.25);
  border-radius:4px;color:var(--txt);padding:5px 8px;
  font-family:'Cairo',sans-serif;font-size:.82em;
}
.batch-btn{
  padding:7px 16px;border:none;border-radius:6px;
  font-family:'Cairo',sans-serif;font-size:.82em;font-weight:700;cursor:pointer;
}
.batch-btn.go{background:var(--gold);color:var(--bg)}
.batch-btn.go:hover{background:var(--gold2)}
.batch-btn.stop{background:rgba(192,57,43,.3);color:#e74c3c;border:1px solid rgba(192,57,43,.4)}
.batch-btn.stop:disabled{opacity:.4}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔒 نور القرآن</h1>
    <p>لوحة التشغيل — للمسؤول فقط</p>
    <div class="pin-input">
      <input type="password" maxlength="1" id="p0" oninput="pinNext(0)">
      <input type="password" maxlength="1" id="p1" oninput="pinNext(1)">
      <input type="password" maxlength="1" id="p2" oninput="pinNext(2)">
      <input type="password" maxlength="1" id="p3" oninput="pinNext(3)">
    </div>
    <button class="btn-login" onclick="checkPin()">دخول</button>
    <div class="login-err" id="pin-err"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="header">
    <div>
      <div class="header-title">⚡ عامل نور القرآن v1.0</div>
      <div class="header-sub">توليد ونشر تلقائي — <span id="hdr-count">0</span> آية مصنفة</div>
    </div>
    <div class="header-status">
      <div class="status-dot" id="gh-dot"></div>
      <span style="font-size:.75em;color:var(--txt2)" id="gh-lbl">GitHub</span>
      <div class="status-dot" id="api-dot" style="margin-right:8px"></div>
      <span style="font-size:.75em;color:var(--txt2)" id="api-lbl">Workers</span>
    </div>
  </div>

  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>الإعدادات</h2>

      <div class="config-group">
        <label class="config-label">🔑 GitHub Token</label>
        <input class="config-input" type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx"
          oninput="localStorage.setItem('nq_token',this.value)">
      </div>

      <div class="config-group">
        <label class="config-label">⏱ تأخير بين الآيات (ثانية)</label>
        <input class="config-input" type="number" id="cfg-delay" value="8" min="3" max="60"
          oninput="localStorage.setItem('nq_delay',this.value)">
      </div>

      <button class="btn btn-secondary" onclick="testConnections()">🔍 اختبار الاتصال</button>
      <button class="btn btn-secondary" onclick="syncStatus()">🔄 مزامنة الحالة</button>

      <br>
      <h2>إحصائيات</h2>
      <div class="stat-row"><span>آيات مصنفة</span><span class="stat-val" id="stat-classified">0</span></div>
      <div class="stat-row"><span>تم نشرها</span><span class="stat-val" id="stat-done">0</span></div>
      <div class="stat-row"><span>متبقية</span><span class="stat-val" id="stat-remain">0</span></div>
      <div class="stat-row"><span>أخطاء</span><span class="stat-val" id="stat-err">0</span></div>

      <br>
      <h2>تحذير</h2>
      <p style="font-size:.75em;color:var(--txt2);line-height:1.7">
        كل آية تستهلك رصيداً من Workers API.<br>
        تأكد من رصيد كافٍ قبل التشغيل الجماعي.
      </p>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <h2>قائمة الآيات المصنفة</h2>

      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>

      <div class="batch-bar">
        <label>تشغيل:</label>
        <select id="batch-mode">
          <option value="selected">المحددة فقط</option>
          <option value="pending">المتبقية فقط</option>
          <option value="all">الكل</option>
        </select>
        <label>تأخير:</label>
        <input type="number" id="batch-delay" value="8" min="3" max="60" style="width:60px">
        <span>ث</span>
        <button class="batch-btn go" id="btn-run" onclick="startBatch()">▶ تشغيل</button>
        <button class="batch-btn stop" id="btn-stop" onclick="stopBatch()" disabled>⏹ إيقاف</button>
        <button class="batch-btn go" style="background:var(--bg3);color:var(--txt);border:1px solid rgba(184,134,11,.3)" onclick="selectAll()">تحديد الكل</button>
        <button class="batch-btn go" style="background:var(--bg3);color:var(--txt);border:1px solid rgba(184,134,11,.3)" onclick="selectNone()">إلغاء التحديد</button>
      </div>

      <div class="queue-grid" id="queue-grid"></div>

      <h2 style="margin:20px 0 10px">سجل العمليات</h2>
      <div class="log-box" id="log-box"></div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   PIN PROTECTION
══════════════════════════════════════════════════════ */
const ADMIN_PIN = "2308"; /* غيّر هذا الرقم */

function pinNext(i){
  const v = document.getElementById('p'+i).value;
  if(v && i < 3) document.getElementById('p'+(i+1)).focus();
  if(i === 3) checkPin();
}
function checkPin(){
  const pin = [0,1,2,3].map(i=>document.getElementById('p'+i).value).join('');
  if(pin === ADMIN_PIN){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pin-err').textContent = 'رمز خاطئ — حاول مرة أخرى';
    [0,1,2,3].forEach(i=>{document.getElementById('p'+i).value='';});
    document.getElementById('p0').focus();
  }
}
document.addEventListener('keydown', e=>{ if(e.key==='Enter') checkPin(); });

/* ══════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════ */
const SOURCES_WORKER = "https://worker-nour-sources-v1.khayati1hafedh.workers.dev";
const AI_WORKER      = "https://worker-nour-ai-v1.khayati1hafedh.workers.dev";
const GH_OWNER = "khayati-quran", GH_REPO = "ibar-for-all-verses";
const GH_API   = "https://api.github.com";

/* ══════════════════════════════════════════════════════
   AYAH TYPE MAP — مصدر التصنيف الثابت
   يُحدَّث من c35 عند إضافة دفعات جديدة
══════════════════════════════════════════════════════ */
const AYAH_TYPE_MAP = {
  "1:1": "tawhid",  "1:2": "tawhid",  "1:3": "tawhid",  "1:4": "tawhid",
  "1:5": "ibada",   "1:6": "hidaya",  "1:7": "hidaya",
  "2:1": "tawhid",  "2:2": "hidaya",  "2:3": "ibada",
  "2:4": "hidaya",  "2:5": "hidaya",  "2:6": "waeid",
  "2:7": "waeid",   "2:8": "akhlaqi", "2:9": "akhlaqi", "2:10": "waeid",
};

const TYPE_LABELS = {
  tawhid:"توحيد", hidaya:"هداية", ibada:"عبادة", qissa:"قصة",
  tashri3:"تشريع", waad:"وعد", waeid:"وعيد", kawni:"كوني",
  akhlaqi:"أخلاقي", duaa:"دعاء"
};

const SURAHS=[
  {n:1,name:'الفاتحة',ayahs:7},{n:2,name:'البقرة',ayahs:286},{n:3,name:'آل عمران',ayahs:200},
  {n:4,name:'النساء',ayahs:176},{n:5,name:'المائدة',ayahs:120},{n:6,name:'الأنعام',ayahs:165},
  {n:7,name:'الأعراف',ayahs:206},{n:8,name:'الأنفال',ayahs:75},{n:9,name:'التوبة',ayahs:129},
  {n:10,name:'يونس',ayahs:109},{n:11,name:'هود',ayahs:123},{n:12,name:'يوسف',ayahs:111},
  {n:114,name:'الناس',ayahs:6}
];

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let queue = [];       // [{key, sn, an, type, status}]
let isRunning = false;
let stopFlag  = false;
let doneKeys  = new Set(); // keys already published
let errCount  = 0;

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
function initApp(){
  // Restore token & delay
  const t = localStorage.getItem('nq_token');
  const d = localStorage.getItem('nq_delay');
  if(t) document.getElementById('cfg-token').value = t;
  if(d) document.getElementById('cfg-delay').value = d;

  buildQueue();
  renderQueue();
  syncStatus();
}

function buildQueue(){
  queue = Object.entries(AYAH_TYPE_MAP).map(([key, type]) => {
    const [sn, an] = key.split(':').map(Number);
    return {key, sn, an, type, status:'pending', msg:''};
  });
  document.getElementById('hdr-count').textContent = queue.length;
  document.getElementById('stat-classified').textContent = queue.length;
  updateStats();
}

function renderQueue(){
  const grid = document.getElementById('queue-grid');
  grid.innerHTML = '';
  queue.forEach(item => {
    const card = document.createElement('div');
    card.className = 'q-card ' + (item.status === 'done' ? 'done' : item.status === 'error' ? 'error' : item.status === 'running' ? 'running' : '');
    card.id = 'card-' + item.key.replace(':','-');
    const sur = SURAHS.find(s=>s.n===item.sn);
    const surName = sur ? sur.name : 'سورة '+item.sn;
    card.innerHTML = `
      <div class="q-check"><input type="checkbox" class="item-check" data-key="${item.key}" ${item.status==='pending'?'checked':''}></div>
      <div class="q-key">${item.key} — ${surName}</div>
      <span class="q-type ${item.type}">${TYPE_LABELS[item.type]||item.type}</span>
      <div class="q-status ${item.status}">${statusLabel(item)}</div>
    `;
    grid.appendChild(card);
  });
}

function statusLabel(item){
  if(item.status==='done') return '✅ منشور';
  if(item.status==='error') return '❌ ' + (item.msg||'خطأ');
  if(item.status==='running') return '⚡ جاري...';
  return '⏳ منتظر';
}

function updateCard(key){
  const item = queue.find(x=>x.key===key);
  if(!item) return;
  const card = document.getElementById('card-'+key.replace(':','-'));
  if(!card) return;
  card.className = 'q-card ' + (item.status==='done'?'done':item.status==='error'?'error':item.status==='running'?'running':'');
  card.querySelector('.q-status').className = 'q-status '+item.status;
  card.querySelector('.q-status').textContent = statusLabel(item);
}

function updateStats(){
  const done = queue.filter(x=>x.status==='done').length;
  const err  = queue.filter(x=>x.status==='error').length;
  const rem  = queue.filter(x=>x.status==='pending').length;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-err').textContent  = err;
  document.getElementById('stat-remain').textContent = rem;
  const pct = queue.length > 0 ? Math.round((done/queue.length)*100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
}

function selectAll(){
  document.querySelectorAll('.item-check').forEach(c=>c.checked=true);
}
function selectNone(){
  document.querySelectorAll('.item-check').forEach(c=>c.checked=false);
}

/* ══════════════════════════════════════════════════════
   CONNECTION TEST
══════════════════════════════════════════════════════ */
async function testConnections(){
  const token = document.getElementById('cfg-token').value.trim();
  log('اختبار الاتصال...','info');

  // GitHub
  try{
    const r = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}`,
      {headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(r.ok){ setDot('gh','ok'); log('GitHub: متصل ✅','ok'); }
    else { setDot('gh','err'); log('GitHub: خطأ '+r.status,'err'); }
  }catch(e){ setDot('gh','err'); log('GitHub: '+e.message,'err'); }

  // Workers
  try{
    const r = await fetch(SOURCES_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({surah_number:1,ayah_number:1})});
    if(r.ok){ setDot('api','ok'); log('Workers: متصل ✅','ok'); }
    else { setDot('api','err'); log('Workers: خطأ '+r.status,'err'); }
  }catch(e){ setDot('api','err'); log('Workers: '+e.message,'err'); }
}

function setDot(id, state){
  const dot = document.getElementById(id+'-dot');
  dot.className = 'status-dot ' + (state==='ok'?'ok':'err');
}

/* ══════════════════════════════════════════════════════
   SYNC STATUS — check which articles already published
══════════════════════════════════════════════════════ */
async function syncStatus(){
  const token = document.getElementById('cfg-token').value.trim();
  if(!token){ log('أدخل GitHub Token أولاً','warn'); return; }
  log('مزامنة الحالة من GitHub...','info');
  try{
    const r = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/articles.json`,
      {headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(r.ok){
      const j = await r.json();
      const txt = decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
      const arts = JSON.parse(txt);
      doneKeys = new Set(arts.map(a=>`${a.surah_number}:${a.ayah_number}`));
      queue.forEach(item=>{
        if(doneKeys.has(item.key)) item.status = 'done';
      });
      renderQueue();
      updateStats();
      log(`مزامنة: ${doneKeys.size} مقال منشور`,'ok');
    } else {
      log('articles.json غير موجود — سيُنشأ عند أول نشر','warn');
    }
  }catch(e){ log('خطأ في المزامنة: '+e.message,'err'); }
}

/* ══════════════════════════════════════════════════════
   BATCH RUN
══════════════════════════════════════════════════════ */
async function startBatch(){
  const token = document.getElementById('cfg-token').value.trim();
  if(!token){ log('أدخل GitHub Token','warn'); return; }
  if(isRunning){ log('التشغيل جارٍ بالفعل','warn'); return; }

  const mode = document.getElementById('batch-mode').value;
  const delay = parseInt(document.getElementById('batch-delay').value||'8') * 1000;

  let targets = [];
  if(mode === 'selected'){
    const checked = [...document.querySelectorAll('.item-check:checked')].map(c=>c.dataset.key);
    targets = queue.filter(x=>checked.includes(x.key) && x.status !== 'done');
  } else if(mode === 'pending'){
    targets = queue.filter(x=>x.status === 'pending');
  } else {
    targets = queue.filter(x=>x.status !== 'done');
  }

  if(!targets.length){ log('لا توجد آيات للتشغيل','warn'); return; }

  isRunning = true; stopFlag = false;
  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  log(`بدء التشغيل: ${targets.length} آية`,'info');

  for(const item of targets){
    if(stopFlag) break;
    await processOne(item, token);
    updateStats();
    if(!stopFlag && targets.indexOf(item) < targets.length - 1){
      log(`انتظار ${delay/1000}ث...`,'info');
      await sleep(delay);
    }
  }

  isRunning = false;
  document.getElementById('btn-run').disabled  = false;
  document.getElementById('btn-stop').disabled = true;
  log(stopFlag ? 'تم الإيقاف' : '✅ اكتمل التشغيل', stopFlag?'warn':'ok');
}

function stopBatch(){
  stopFlag = true;
  log('إيقاف بعد الآية الحالية...','warn');
}

async function processOne(item, token){
  item.status = 'running';
  updateCard(item.key);
  log(`⚡ [${item.key}] جاري التوليد...`,'info');

  try{
    // 1) جلب المصادر
    const sourceRes = await fetch(SOURCES_WORKER,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({surah_number:item.sn, ayah_number:item.an})
    });
    if(!sourceRes.ok) throw new Error('Sources Worker: '+sourceRes.status);
    const sourceData = await sourceRes.json();

    // 2) توليد AI
    const aiRes = await fetch(AI_WORKER,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({surah_number:item.sn, ayah_number:item.an, sources:sourceData})
    });
    if(!aiRes.ok) throw new Error('AI Worker: '+aiRes.status);
    const aiData = await aiRes.json();

    // 3) دمج البيانات
    const d = Object.assign({}, sourceData, aiData, {
      surah_number: item.sn, ayah_number: item.an,
      ayah_type: item.type,
      fetched_sources: sourceData
    });

    // 4) بناء الـ HTML (نفس اسم الملف من generator)
    const fn = `surah-${item.sn}-ayah-${item.an}g.html`;
    const html = buildArticleHtml(d);

    // 5) نشر على GitHub
    await writeF(token, fn, html, `نشر: سورة ${d.surah_name||item.sn} — الآية ${item.an}`);

    // 6) تحديث articles.json
    await updateArticlesJson(token, d);

    item.status = 'done';
    updateCard(item.key);
    log(`✅ [${item.key}] نُشر بنجاح`,'ok');

  } catch(e){
    item.status = 'error';
    item.msg = e.message.slice(0,40);
    updateCard(item.key);
    errCount++;
    log(`❌ [${item.key}] ${e.message}`,'err');
  }
}

/* بناء HTML للمقال — يعيد توجيه للـ generator للتوليد الفعلي */
function buildArticleHtml(d){
  const title = `تفسير سورة ${d.surah_name||''}  — الآية ${d.ayah_number}`;
  /* هنا يُستدعى generator المباشر عبر iframe أو يُعاد بناء HTML
     في المرحلة الحالية: نبني redirect يشغّل generator لإنتاج الصفحة */
  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><title>${title}</title>
<meta name="description" content="تفسير وعبرة — ${title}">
<meta http-equiv="refresh" content="0;url=generator35.html?s=${d.surah_number}&a=${d.ayah_number}&auto=1">
</head><body><p style="text-align:center;padding:40px;font-family:Cairo,sans-serif">
جاري التحميل...</p></body></html>`;
}

/* ══════════════════════════════════════════════════════
   GITHUB HELPERS
══════════════════════════════════════════════════════ */
async function writeF(token, path, text, msg){
  let sha = null;
  const c = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,
    {headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
  if(c.ok){ const j=await c.json(); sha=j.sha||null; }
  const body = {message:msg, content:btoa(unescape(encodeURIComponent(text)))};
  if(sha) body.sha = sha;
  const p = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,
    {method:'PUT',headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
     body:JSON.stringify(body)});
  if(!p.ok){ const t=await p.text(); throw new Error('GitHub write: '+t.slice(0,60)); }
}

async function updateArticlesJson(token, d){
  let arts = [];
  try{
    const r = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/articles.json`,
      {headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'}});
    if(r.ok){
      const j = await r.json();
      arts = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    }
  }catch(e){}

  const key = `${d.surah_number}:${d.ayah_number}`;
  const existing = arts.findIndex(a=>`${a.surah_number}:${a.ayah_number}` === key);
  const entry = {
    surah_number: d.surah_number,
    ayah_number:  d.ayah_number,
    surah_name:   d.surah_name  || '',
    ayah_type:    d.ayah_type   || '',
    title:        `تفسير سورة ${d.surah_name||d.surah_number} — الآية ${d.ayah_number}`,
    url:          `surah-${d.surah_number}-ayah-${d.ayah_number}g.html`,
    published_at: new Date().toISOString()
  };
  if(existing >= 0) arts[existing] = entry;
  else arts.unshift(entry);

  await writeF(token,'articles.json',JSON.stringify(arts,null,2),
    `تحديث المقالات: ${entry.title}`);
}

/* ══════════════════════════════════════════════════════
   LOG
══════════════════════════════════════════════════════ */
function log(msg, type=''){
  const box = document.getElementById('log-box');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  const ts = new Date().toLocaleTimeString('ar-DZ');
  line.textContent = `[${ts}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
