<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توليد المقال</title>
</head>
<body style="font-family:Arial;padding:20px;max-width:800px;margin:auto">

  <h2>توليد مقال حقيقي</h2>

  <select id="surah">
    <option value="الفاتحة">الفاتحة</option>
  </select>

  <input id="ayah" value="1" type="number" min="1" style="width:60px">

  <br><br>

  <button onclick="generate()">توليد</button>

  <pre id="output" style="white-space:pre-wrap;margin-top:20px;background:#eee;padding:15px"></pre>

  <script>
    async function generate() {
      const surah = document.getElementById("surah").value.trim();
      const ayah = document.getElementById("ayah").value.trim();
      const output = document.getElementById("output");

      output.innerText = "جارٍ التوليد...";

      try {
        const res = await fetch("https://nour-quran-worker.khayati1hafedh.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            surah,
            ayah
          })
        });

        const data = await res.json();

        if (!res.ok) {
          output.innerText = "خطأ:\n" + JSON.stringify(data, null, 2);
          return;
        }

        if (!data.ok || !data.article) {
          output.innerText = "الرد غير متوقع:\n" + JSON.stringify(data, null, 2);
          return;
        }

        output.innerText = data.article;
      } catch (e) {
        output.innerText = "خطأ:\n" + e.message;
      }
    }
  </script>

</body>
</html>
